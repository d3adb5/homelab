apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: victoria-metrics-longterm
spec:
  retentionPeriod: "1y"
  replicaCount: 1

  extraArgs:
    dedup.minScrapeInterval: 60s

  storage:
    storageClassName: truenas-iscsi-hdd
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
