apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: victoria-metrics-oauth2-proxy
spec:
  forwardAuth:
    address: http://victoria-metrics-oauth2-proxy.monitoring.svc.cluster.local
    trustForwardHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: victoria-metrics-vmui
spec:
  redirectRegex:
    regex: ^https://prometheus\.d3adb5\.ca/?$
    replacement: https://prometheus.d3adb5.ca/select/0/vmui/
    permanent: false
