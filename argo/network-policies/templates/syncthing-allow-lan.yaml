---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syncthing-allow-lan
  namespace: syncthing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: syncthing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 22000
        - protocol: UDP
          port: 22000
