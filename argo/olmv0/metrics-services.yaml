apiVersion: v1
kind: Service
metadata:
  name: olm-operator-metrics
  namespace: operator-lifecycle-manager
  labels:
    app: olm-operator
spec:
  type: ClusterIP
  selector:
    app: olm-operator
  ports:
  - name: https-metrics
    port: 8080
    protocol: TCP
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-operator-metrics
  namespace: operator-lifecycle-manager
  labels:
    app: catalog-operator
spec:
  type: ClusterIP
  selector:
    app: catalog-operator
  ports:
  - name: https-metrics
    port: 8080
    protocol: TCP
    targetPort: 8080
